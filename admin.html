<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — TOEIC Practice</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Source+Serif+4:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root { --navy:#1e3a5f; --gold:#c9a84c; --cream:#f8f4ee; --light-gold:#e8d5a3; --dark-gold:#a07830; --border:#d4c5a9; --success:#2e7d52; --error:#c0392b; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Source Serif 4',serif; background:var(--cream); color:#1a1a2e; min-height:100vh; }
    header { background:var(--navy); color:var(--cream); padding:1.2rem 1.5rem; border-bottom:3px solid var(--gold); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:0.5rem; }
    header h1 { font-family:'Playfair Display',serif; font-size:1.3rem; color:var(--gold); }
    .badge-admin { background:var(--gold); color:var(--navy); font-size:0.72rem; font-weight:700; padding:0.2rem 0.6rem; border-radius:20px; letter-spacing:0.06em; text-transform:uppercase; }
    .gate { display:flex; align-items:center; justify-content:center; min-height:80vh; }
    .gate-card { background:#fff; border:1px solid var(--border); border-top:4px solid var(--gold); border-radius:6px; padding:2rem; width:100%; max-width:360px; }
    .gate-card h2 { font-family:'Playfair Display',serif; color:var(--navy); margin-bottom:1.2rem; }
    label { display:block; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--navy); font-weight:600; margin-bottom:0.4rem; }
    input { width:100%; padding:0.65rem 0.8rem; border:1px solid var(--border); border-radius:4px; font-size:1rem; font-family:'Source Serif 4',serif; background:var(--cream); margin-bottom:1rem; }
    .btn { width:100%; padding:0.75rem; background:var(--navy); color:var(--cream); border:none; border-radius:4px; font-size:1rem; font-family:'Playfair Display',serif; cursor:pointer; }
    .btn:hover { background:var(--dark-gold); }
    .msg-err { color:var(--error); font-size:0.85rem; margin-bottom:0.8rem; }
    main { max-width:1100px; margin:0 auto; padding:2rem 1rem; }
    h2 { font-family:'Playfair Display',serif; font-size:1.15rem; color:var(--navy); border-bottom:2px solid var(--light-gold); padding-bottom:0.5rem; margin-bottom:1.2rem; }
    .toolbar { display:flex; gap:0.8rem; margin-bottom:1rem; flex-wrap:wrap; align-items:center; }
    .toolbar select, .toolbar input[type=text] { padding:0.4rem 0.7rem; border:1px solid var(--border); border-radius:4px; font-size:0.88rem; font-family:'Source Serif 4',serif; background:var(--cream); width:auto; }
    .btn-export { background:var(--gold); color:var(--navy); border:none; border-radius:4px; padding:0.4rem 1rem; font-size:0.85rem; cursor:pointer; font-weight:600; }
    .btn-export:hover { background:var(--dark-gold); color:var(--cream); }
    .btn-reset { background:#fdecea; color:var(--error); border:1px solid var(--error); border-radius:4px; padding:0.4rem 1rem; font-size:0.85rem; cursor:pointer; font-weight:600; margin-left:auto; }
    .btn-reset:hover { background:var(--error); color:#fff; }
    .btn-reset:disabled { opacity:0.6; cursor:not-allowed; }
    .btn-delete { background:#fdecea; color:var(--error); border:1px solid var(--error); border-radius:4px; padding:0.25rem 0.6rem; font-size:0.75rem; cursor:pointer; font-weight:600; white-space:nowrap; }
    .btn-delete:hover { background:var(--error); color:#fff; }
    .btn-retake { background:#e6f4ec; color:var(--success); border:1px solid var(--success); border-radius:4px; padding:0.25rem 0.6rem; font-size:0.75rem; cursor:pointer; font-weight:600; white-space:nowrap; }
    .btn-retake:hover { background:var(--success); color:#fff; }
    .badge-granted { display:inline-block; background:#fef9ec; color:var(--dark-gold); border:1px solid var(--light-gold); border-radius:4px; padding:0.25rem 0.6rem; font-size:0.72rem; font-weight:600; white-space:nowrap; }
    .superseded { color:#9ca3af; font-size:0.72rem; font-style:italic; }
    .btn-reset-code { background:#fff; color:var(--navy); border:1px solid var(--navy); border-radius:4px; padding:0.25rem 0.6rem; font-size:0.75rem; cursor:pointer; font-weight:600; white-space:nowrap; margin-right:0.3rem; }
    .btn-reset-code:hover { background:var(--navy); color:#fff; }
    .access-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:0.8rem; }
    .access-card { background:#fff; border:1px solid var(--border); border-radius:6px; padding:1rem 1.1rem; display:flex; align-items:center; justify-content:space-between; gap:1rem; }
    .access-card .name { font-family:'Playfair Display',serif; color:var(--navy); font-size:0.95rem; }
    .access-card .part { font-size:0.75rem; color:#9ca3af; }
    .switch { position:relative; display:inline-block; width:46px; height:26px; flex-shrink:0; }
    .switch input { opacity:0; width:0; height:0; }
    .switch .slider { position:absolute; cursor:pointer; inset:0; background:#d1d5db; border-radius:26px; transition:0.2s; }
    .switch .slider:before { position:absolute; content:""; height:20px; width:20px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:0.2s; }
    .switch input:checked + .slider { background:var(--success); }
    .switch input:checked + .slider:before { transform:translateX(20px); }
    .switch input:disabled + .slider { opacity:0.5; cursor:not-allowed; }
    table { width:100%; border-collapse:collapse; font-size:0.85rem; }
    th { background:var(--navy); color:var(--gold); padding:0.6rem 0.8rem; text-align:left; font-family:'Playfair Display',serif; font-weight:400; }
    td { padding:0.55rem 0.8rem; border-bottom:1px solid var(--border); }
    tr:hover td { background:#fdf8f0; }
    .pct.good { color:var(--success); font-weight:600; }
    .pct.mid  { color:var(--dark-gold); font-weight:600; }
    .pct.bad  { color:var(--error); font-weight:600; }
    .chips { display:flex; flex-wrap:wrap; gap:0.3rem; }
    .chip { background:#f3f4f6; border:1px solid var(--border); border-radius:3px; font-size:0.7rem; padding:0.1rem 0.4rem; white-space:nowrap; }
    .section-title { background:#f3f4f6; padding:0.5rem 0.8rem; font-size:0.8rem; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:#6b7280; border-bottom:1px solid var(--border); }
    footer { text-align:center; font-size:0.75rem; color:#999; padding:1.5rem; border-top:1px solid var(--border); margin-top:2rem; }
  </style>
</head>
<body>
  <header>
    <h1>TOEIC — Full Practice</h1>
    <span class="badge-admin">Admin</span>
  </header>

  <!-- Gate -->
  <div class="gate" id="gate">
    <div class="gate-card">
      <h2>Admin access</h2>
      <div class="msg-err" id="gate-err" style="display:none"></div>
      <label>Admin code</label>
      <input type="password" id="admin-code" placeholder="Password" autocomplete="off">
      <button class="btn" onclick="checkAdmin()">Enter</button>
    </div>
  </div>

  <!-- Panel admin (hidden until auth) -->
  <main id="admin-panel" style="display:none">
    <h2>Test availability</h2>
    <div class="toolbar">
      <button id="btn-close-all" class="btn-reset" onclick="closeAllTests()">🔒 Close all tests</button>
      <button id="btn-open-all" class="btn-export" onclick="openAllTests()">🔓 Open all tests</button>
    </div>
    <div id="access-wrap"><p style="color:#9ca3af;font-style:italic">Loading…</p></div>

    <h2 style="margin-top:2.5rem">Overview — Results</h2>
    <div class="toolbar">
      <select id="filter-test" onchange="render()"><option value="">All tests</option></select>
      <select id="filter-dept" onchange="render()"><option value="">All departments</option></select>
      <input type="text" id="filter-nom" placeholder="Filter by name…" oninput="render()">
      <button class="btn-export" onclick="exportXLSX()">⬇ Export Excel</button>
      <button id="btn-reset" class="btn-reset" onclick="resetAllScores()">🗑 Reset all results</button>
    </div>
    <div id="table-wrap"><p style="color:#9ca3af;font-style:italic">Loading…</p></div>

    <h2 id="students-heading" style="margin-top:2.5rem">Registered students</h2>
    <div class="toolbar" id="students-toolbar" style="display:none">
      <button id="btn-approve-all" class="btn-export" onclick="approveAll()">✅ Approve all pending</button>
    </div>
    <div id="students-wrap"><p style="color:#9ca3af;font-style:italic">Loading…</p></div>
  </main>

  <footer>Copyright Marc Vasseur — Polytech Lille</footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="tests-data.js"></script>
  <script src="scoring.js"></script>
  <script>
    // Admin code — same password as Suivi Scores TOEIC
    const ADMIN_HASH = 'f7ff32b790557d7601029bc0b296115f82e18d799b6e27ba0c6202fdbd1f2a08';

    async function sha256(text) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    async function checkAdmin() {
      const code = document.getElementById('admin-code').value;
      const h = await sha256(code);
      if (h !== ADMIN_HASH) {
        const err = document.getElementById('gate-err');
        err.textContent = 'Incorrect code.'; err.style.display = 'block'; return;
      }
      document.getElementById('gate').style.display = 'none';
      document.getElementById('admin-panel').style.display = 'block';
      loadAll();
      loadAccess();
    }

    let allScores = [], allStudents = [];

    async function loadAccess() {
      try {
        const r = await fetch('/api/access');
        const data = await r.json();
        const access = data.tests || {};
        const wrap = document.getElementById('access-wrap');
        const ids = Object.keys(TESTS_DATA);
        wrap.innerHTML = `<div class="access-grid">${ids.map(id => {
          const t = TESTS_DATA[id];
          const isOpen = access[id] !== false;
          return `
            <div class="access-card">
              <div>
                <div class="name">${t.name}</div>
                <div class="part">${t.part}</div>
              </div>
              <label class="switch">
                <input type="checkbox" ${isOpen ? 'checked' : ''} onchange="toggleAccess('${id}', this.checked, this)">
                <span class="slider"></span>
              </label>
            </div>
          `;
        }).join('')}</div>`;
      } catch(e) {
        document.getElementById('access-wrap').innerHTML = '<p style="color:red">Loading error.</p>';
      }
    }

    async function toggleAccess(testId, open, checkboxEl) {
      checkboxEl.disabled = true;
      try {
        const r = await fetch('/api/access', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Admin-Hash': ADMIN_HASH },
          body: JSON.stringify({ testId, open })
        });
        if (!r.ok) throw new Error();
      } catch(e) {
        alert('Could not update access — reverting.');
        checkboxEl.checked = !open;
      } finally {
        checkboxEl.disabled = false;
      }
    }

    async function bulkSetAccess(open, btn, label) {
      const ids = Object.keys(TESTS_DATA);
      const sure = confirm(`${open ? 'Open' : 'Close'} all ${ids.length} tests at once?`);
      if (!sure) return;
      btn.disabled = true; btn.textContent = open ? 'Opening…' : 'Closing…';
      try {
        const tests = Object.fromEntries(ids.map(id => [id, open]));
        const r = await fetch('/api/access', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Admin-Hash': ADMIN_HASH },
          body: JSON.stringify({ tests })
        });
        if (!r.ok) throw new Error();
        await loadAccess();
      } catch(e) {
        alert(`Could not ${open ? 'open' : 'close'} all tests. Please try again.`);
      } finally {
        btn.disabled = false; btn.textContent = label;
      }
    }

    function closeAllTests() {
      bulkSetAccess(false, document.getElementById('btn-close-all'), '🔒 Close all tests');
    }
    function openAllTests() {
      bulkSetAccess(true, document.getElementById('btn-open-all'), '🔓 Open all tests');
    }

    async function loadAll() {
      try {
        const headers = { 'X-Admin-Hash': ADMIN_HASH };
        const [sr, studr] = await Promise.all([
          fetch('/api/admin?resource=scores', { headers }).then(r => r.json()),
          fetch('/api/admin?resource=students', { headers }).then(r => r.json())
        ]);
        allScores   = sr.scores   || [];
        allStudents = studr.students || [];

        // Populate test filter
        const sel = document.getElementById('filter-test');
        sel.innerHTML = '<option value="">All tests</option>';
        const testIds = [...new Set(allScores.map(s => s.testId))];
        testIds.forEach(id => {
          const opt = document.createElement('option');
          opt.value = id; opt.textContent = (TESTS_DATA[id] ? `${TESTS_DATA[id].name} — ${TESTS_DATA[id].part}` : id);
          sel.appendChild(opt);
        });

        // Populate department filter
        const deptSel = document.getElementById('filter-dept');
        const currentDept = deptSel.value;
        deptSel.innerHTML = '<option value="">All departments</option>';
        const depts = [...new Set(allStudents.map(s => s.dept).filter(Boolean))].sort();
        depts.forEach(d => {
          const opt = document.createElement('option');
          opt.value = d; opt.textContent = d;
          deptSel.appendChild(opt);
        });
        if (depts.includes(currentDept)) deptSel.value = currentDept;

        document.getElementById('students-toolbar').style.display = 'flex';

        render();
        renderStudents();
      } catch(e) {
        document.getElementById('table-wrap').innerHTML = '<p style="color:red">Loading error.</p>';
      }
    }

    async function approveAll() {
      const pendingCount = allStudents.filter(s => s.approved === false).length;
      if (pendingCount === 0) { alert('No pending accounts to approve.'); return; }
      const sure = confirm(`Approve all ${pendingCount} pending account(s)?`);
      if (!sure) return;
      const btn = document.getElementById('btn-approve-all');
      btn.disabled = true; btn.textContent = 'Approving…';
      try {
        const r = await fetch('/api/admin?resource=approve-all', {
          method: 'POST',
          headers: { 'X-Admin-Hash': ADMIN_HASH }
        });
        if (!r.ok) throw new Error();
        await loadAll();
      } catch(e) {
        alert('Error while approving accounts. Please try again.');
      } finally {
        btn.disabled = false; btn.textContent = '✅ Approve all pending';
      }
    }

    async function resetAllScores() {
      const sure = confirm(
        `⚠️ This will PERMANENTLY delete all results for all students (${allScores.length} result(s)).\n\n` +
        `Student accounts (name/code) are not affected.\n\n` +
        `Remember to export the CSV first if needed. Continue?`
      );
      if (!sure) return;
      const confirmText = prompt('To confirm, type RESET in capital letters:');
      if (confirmText !== 'RESET') { alert('Cancelled — confirmation text did not match.'); return; }

      const btn = document.getElementById('btn-reset');
      btn.disabled = true; btn.textContent = 'Resetting…';
      try {
        const r = await fetch('/api/admin?resource=scores', {
          method: 'DELETE',
          headers: { 'X-Admin-Hash': ADMIN_HASH }
        });
        if (!r.ok) throw new Error();
        alert('All results have been deleted.');
        await loadAll();
      } catch(e) {
        alert('Error while resetting. Please try again.');
      } finally {
        btn.disabled = false; btn.textContent = '🗑 Reset all results';
      }
    }

    function pctClass(p) { return p >= 75 ? 'good' : p >= 50 ? 'mid' : 'bad'; }

    async function allowRetake(nom, testId, date) {
      const sure = confirm(
        `Grant ${nom} one more attempt at ${testLabel(testId)}?\n\n` +
        `This result stays on record. They'll be able to submit a new attempt once; the old one is kept for history. Continue?`
      );
      if (!sure) return;
      try {
        const r = await fetch('/api/admin?resource=grant-retake', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Admin-Hash': ADMIN_HASH },
          body: JSON.stringify({ nom, testId, date })
        });
        if (!r.ok) throw new Error();
        await loadAll();
      } catch(e) {
        alert('Error while granting retake. Please try again.');
      }
    }

    function testLabel(id) {
      const t = TESTS_DATA[id];
      return t ? `${t.name} — ${t.part}` : id;
    }

    function enrichScore(s) {
      const TEST = TESTS_DATA[s.testId];
      if (!TEST) return { ...s, TEST: null, breakdown: {}, converted: null, cecrl: '—' };
      const breakdown = computePartBreakdown(TEST, s.answers || []);
      const converted = convertedSectionScore(TEST.section, s.score);
      const cecrl = cecrlForTable(converted, TEST.section === 'L' ? CECRL_LISTENING : CECRL_READING);
      return { ...s, TEST, breakdown, converted, cecrl };
    }

    function render() {
      const testFilter = document.getElementById('filter-test').value;
      const deptFilter = document.getElementById('filter-dept').value;
      const nomFilter  = document.getElementById('filter-nom').value.trim().toUpperCase();
      const student = allStudents.reduce((m, s) => { m[s.nom] = s; return m; }, {});
      let rows = allScores.filter(s =>
        (!testFilter || s.testId === testFilter) &&
        (!nomFilter  || s.nom.includes(nomFilter)) &&
        (!deptFilter || (student[s.nom] && student[s.nom].dept === deptFilter))
      ).sort((a,b) => new Date(b.date) - new Date(a.date)).map(enrichScore);

      if (!rows.length) {
        document.getElementById('table-wrap').innerHTML = '<p style="color:#9ca3af;font-style:italic">No results.</p>';
        return;
      }
      document.getElementById('table-wrap').innerHTML = `
        <table>
          <thead><tr><th>Last name</th><th>First name</th><th>Dept</th><th>Test</th><th>Part breakdown</th><th>Score</th><th>/495</th><th>Level</th><th>Date</th><th></th></tr></thead>
          <tbody>${rows.map(s => {
            const stu = student[s.nom] || {};
            const d = new Date(s.date).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
            const chips = s.TEST ? s.TEST.partIds.map(pid => {
              const b = s.breakdown[pid];
              return `<span class="chip">${partCanonById(pid).label}: ${b.correct}/${b.max}</span>`;
            }).join('') : '—';
            const safeName = s.nom.replace(/'/g, "\\'");
            const isLatest = !allScores.some(o => o.nom === s.nom && o.testId === s.testId && new Date(o.date) > new Date(s.date));
            const safeDate = s.date.replace(/'/g, "\\'");
            let actionCell;
            if (s.retakeGranted) {
              actionCell = '<span class="badge-granted">🔓 Retake granted</span>';
            } else if (isLatest) {
              actionCell = `<button class="btn-retake" onclick="allowRetake('${safeName}', '${s.testId}', '${safeDate}')">🔄 Allow retake</button>`;
            } else {
              actionCell = '<span class="superseded">superseded</span>';
            }
            return `<tr>
              <td>${s.nom}</td>
              <td>${stu.prenom||'-'}</td>
              <td>${stu.dept||'-'}</td>
              <td>${testLabel(s.testId)}</td>
              <td><div class="chips">${chips}</div></td>
              <td>${s.score}/${s.total}</td>
              <td>${s.converted !== null ? s.converted : '—'}</td>
              <td>${s.cecrl}</td>
              <td>${d}</td>
              <td>${actionCell}</td>
            </tr>`;
          }).join('')}</tbody>
        </table>
        <p style="font-size:0.78rem;color:#9ca3af;margin-top:0.5rem">${rows.length} result(s)</p>
      `;
    }

    function renderStudents() {
      if (!allStudents.length) {
        document.getElementById('students-wrap').innerHTML = '<p style="color:#9ca3af;font-style:italic">No students registered.</p>';
        return;
      }
      // Accounts created before the approval system existed have no
      // `approved` field — treat those as already approved.
      const isApproved = s => s.approved !== false;
      const pendingCount = allStudents.filter(s => !isApproved(s)).length;
      document.getElementById('students-heading').textContent =
        pendingCount ? `Registered students (${pendingCount} pending approval)` : 'Registered students';

      const totalTests = Object.keys(TESTS_DATA).length;
      const sorted = [...allStudents].sort((a, b) => {
        if (isApproved(a) === isApproved(b)) return 0;
        return isApproved(a) ? 1 : -1; // pending first
      });

      document.getElementById('students-wrap').innerHTML = `
        <table>
          <thead><tr><th>Last name</th><th>First name</th><th>Department</th><th>Registered</th><th>Tests done</th><th>Avg %</th><th>Approved</th><th></th></tr></thead>
          <tbody>${sorted.map(s => {
            const d = s.createdAt ? new Date(s.createdAt).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '-';
            const approved = isApproved(s);
            const safeName = s.nom.replace(/'/g, "\\'");
            const theirScores = allScores.filter(sc => sc.nom === s.nom);
            const testsDone = new Set(theirScores.map(sc => sc.testId)).size;
            const avgPct = theirScores.length
              ? Math.round(theirScores.reduce((sum, sc) => sum + (sc.score / sc.total * 100), 0) / theirScores.length)
              : null;
            return `<tr${approved ? '' : ' style="background:#fef9ec"'}>
              <td>${s.nom}</td><td>${s.prenom}</td><td>${s.dept}</td><td>${d}</td>
              <td>${testsDone}/${totalTests}</td>
              <td>${avgPct !== null ? `<span class="pct ${pctClass(avgPct)}">${avgPct}%</span>` : '—'}</td>
              <td>
                <label class="switch">
                  <input type="checkbox" ${approved ? 'checked' : ''} onchange="toggleApproval('${safeName}', this.checked, this)">
                  <span class="slider"></span>
                </label>
              </td>
              <td style="white-space:nowrap">
                <button class="btn-reset-code" onclick="resetCode('${safeName}')">🔑 Reset code</button>
                <button class="btn-delete" onclick="deleteStudent('${safeName}')">🗑 Delete</button>
              </td>
            </tr>`;
          }).join('')}</tbody>
        </table>
        <p style="font-size:0.78rem;color:#9ca3af;margin-top:0.5rem">${allStudents.length} student(s)</p>
      `;
    }

    async function resetCode(nom) {
      const sure = confirm(`Generate a new secret code for ${nom}?\n\nTheir current code will stop working immediately.`);
      if (!sure) return;
      const newCode = String(Math.floor(Math.random() * 10000)).padStart(4, '0');
      try {
        const codeHash = await sha256(newCode);
        const r = await fetch('/api/admin?resource=reset-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Admin-Hash': ADMIN_HASH },
          body: JSON.stringify({ nom, codeHash })
        });
        if (!r.ok) throw new Error();
        alert(`New code for ${nom}: ${newCode}\n\nGive this to the student — it will not be shown again.`);
      } catch(e) {
        alert('Error while resetting the code. Please try again.');
      }
    }

    async function toggleApproval(nom, approved, checkboxEl) {
      checkboxEl.disabled = true;
      try {
        const r = await fetch('/api/admin?resource=approval', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Admin-Hash': ADMIN_HASH },
          body: JSON.stringify({ nom, approved })
        });
        if (!r.ok) throw new Error();
        const student = allStudents.find(s => s.nom === nom);
        if (student) student.approved = approved;
        renderStudents();
      } catch(e) {
        alert('Could not update approval — reverting.');
        checkboxEl.checked = !approved;
      } finally {
        checkboxEl.disabled = false;
      }
    }

    async function deleteStudent(nom) {
      const scoreCount = allScores.filter(s => s.nom === nom).length;
      const sure = confirm(
        `⚠️ Delete the profile for ${nom}?\n\n` +
        `This also permanently removes their ${scoreCount} result(s). This cannot be undone.\n\nContinue?`
      );
      if (!sure) return;
      try {
        const r = await fetch(`/api/admin?resource=student&nom=${encodeURIComponent(nom)}`, {
          method: 'DELETE',
          headers: { 'X-Admin-Hash': ADMIN_HASH }
        });
        if (!r.ok) throw new Error();
        await loadAll();
      } catch(e) {
        alert('Error while deleting this profile. Please try again.');
      }
    }

    function exportXLSX() {
      if (typeof XLSX === 'undefined') { alert('Excel export library failed to load (network blocked?). Please reload the page.'); return; }
      const testFilter = document.getElementById('filter-test').value;
      const deptFilter = document.getElementById('filter-dept').value;
      const nomFilter  = document.getElementById('filter-nom').value.trim().toUpperCase();
      const student = allStudents.reduce((m, s) => { m[s.nom] = s; return m; }, {});
      let rows = allScores.filter(s =>
        (!testFilter || s.testId === testFilter) &&
        (!nomFilter  || s.nom.includes(nomFilter)) &&
        (!deptFilter || (student[s.nom] && student[s.nom].dept === deptFilter))
      ).map(enrichScore);

      if (!rows.length) { alert('No results to export.'); return; }

      const data = rows.map(s => {
        const stu = student[s.nom] || {};
        const d = new Date(s.date).toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
        const row = {
          'Last Name': s.nom,
          'First Name': stu.prenom || '',
          'Department': stu.dept || '',
          'Test': testLabel(s.testId),
          'Score': `${s.score}/${s.total}`,
          '/495': s.converted ?? '',
          'Level': s.cecrl,
          'Date': d
        };
        if (s.TEST) {
          s.TEST.partIds.forEach(pid => {
            const b = s.breakdown[pid];
            const pct = Math.round(b.correct / b.max * 100);
            row[partCanonById(pid).label] = `${pct}% (${b.correct}/${b.max})`;
          });
        }
        return row;
      });

      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Results');
      XLSX.writeFile(wb, 'toeic-entrainement.xlsx');
    }

    document.getElementById('admin-code').addEventListener('keydown', e => { if (e.key === 'Enter') checkAdmin(); });
  </script>
</body>
